services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gearflow
      POSTGRES_PASSWORD: gearflow
      POSTGRES_DB: gearflow_os
    ports:
      - "5433:5432"
    volumes:
      - os-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearflow -d gearflow_os"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  os-service:
    build: .
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OsDb: Host=postgres;Port=5432;Database=gearflow_os;Username=gearflow;Password=gearflow
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: guest
      RabbitMq__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  os-postgres:

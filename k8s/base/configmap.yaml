apiVersion: v1
kind: ConfigMap
metadata:
  name: gearflow-os-config
data:
  ASPNETCORE_HTTP_PORTS: "8080"
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_EnableDiagnostics: "0"
  # Broker compartilhado do gearflow-infra-broker (namespace messaging). AMQP sem TLS, vhost gearflow.
  RabbitMq__Host: rabbitmq.messaging.svc.cluster.local
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: gearflow
  RabbitMq__Exchange: gearflow.events
  RabbitMq__CommandsExchange: gearflow.commands.v1
  RabbitMq__BillingEventsExchange: gearflow.events.v1
  RabbitMq__Queue: gearflow.os-service
  # Observabilidade da Fase 3: traces e métricas por OTLP para o New Relic (mesmo destino do Inventory).
  # O header api-key sai da licença do Secret newrelic-apm-secret (OTEL_EXPORTER_OTLP_HEADERS no Deployment).
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.nr-data.net:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  Jwt__Issuer: GearFlow.Api
  Jwt__Audience: GearFlow.Client

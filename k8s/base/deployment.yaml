apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearflow-os
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gearflow-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gearflow-os
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: gearflow-os-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gearflow-os-config
            - secretRef:
                name: gearflow-os-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5

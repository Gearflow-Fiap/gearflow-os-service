apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearflow-os
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gearflow-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gearflow-os
        # Exigida pela NetworkPolicy do broker (junto com gearflow.io/messaging-access=true no namespace).
        gearflow.io/rabbitmq-client: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: gearflow-os-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gearflow-os-config
            - secretRef:
                name: gearflow-os-secret
          env:
            # Credencial individual do OS no broker (usuario gearflow_os), copiada pelo operador
            # do namespace messaging para o namespace da aplicacao. Prevalece sobre o envFrom.
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-os-credentials
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-os-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5

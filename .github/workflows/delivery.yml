name: Delivery

# Deploy no EKS depois que o CI da main passa. Desligado por padrão: só roda com a variável DEPLOY_ENABLED=true
# e as variáveis AWS_ROLE_ARN, AWS_REGION e EKS_CLUSTER_NAME (OIDC, sem chave de longa duração no GitHub).
# A imagem vem do docker-publish.yml (tag sha-<commit>); aqui só se espera ela existir e se fixa o deploy no digest.
# Pré-requisitos no cluster em k8s/README.md.

on:
  workflow_run:
    workflows: [CI]   # tem de ser igual ao `name:` do ci.yml
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-delivery
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no Kubernetes
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC com a AWS
    env:
      IMAGE_REPO: ghcr.io/gearflow-fiap/gearflow-os-service
      TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # O docker-publish.yml roda em paralelo ao CI.
      - name: Aguarda a imagem no GHCR e resolve o digest
        id: image
        run: |
          for attempt in $(seq 1 40); do
            digest=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "$digest" ]; then
              echo "ref=$IMAGE_REPO@$digest" >> "$GITHUB_OUTPUT"
              echo "Imagem: $IMAGE_REPO@$digest"
              exit 0
            fi
            echo "Imagem $TAG ainda não publicada (tentativa $attempt/40)"
            sleep 15
          done
          echo "::error::A imagem $IMAGE_REPO:$TAG não apareceu no GHCR em 10 minutos (o pacote precisa ser público)."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Seleciona o cluster
        env:
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Renderiza, valida e aplica
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          kubectl kustomize k8s/base \
            | sed "s#image: gearflow-os-service:local#image: ${IMAGE}#" > "$RUNNER_TEMP/os.yaml"
          grep -q "image: ${IMAGE}" "$RUNNER_TEMP/os.yaml"
          for secret in gearflow-os-secret rabbitmq-os-credentials; do
            kubectl get secret "$secret" -n gearflow >/dev/null || {
              echo "::error::O Secret $secret não existe no namespace gearflow (veja k8s/README.md)."; exit 1; }
          done
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/os.yaml"
          kubectl apply -f "$RUNNER_TEMP/os.yaml"
          kubectl rollout status deployment/gearflow-os -n gearflow --timeout=300s

      - name: Smoke test em /health/ready (Service interno)
        run: |
          kubectl port-forward -n gearflow service/gearflow-os 18080:8080 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/port-forward.log" || true
          exit 1

      - name: Diagnóstico (só em falha)
        if: failure()
        run: |
          kubectl get pods -n gearflow -l app.kubernetes.io/name=gearflow-os -o wide || true
          kubectl logs -n gearflow -l app.kubernetes.io/name=gearflow-os --tail=60 --all-containers || true
